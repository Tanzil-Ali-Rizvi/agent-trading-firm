name: Live paper trading
# One cycle per hour. State (the paper book, decision log, candle cache) lives on the `data` branch, which is
# force-pushed as a single commit each run so the repository does not grow by an hourly commit forever.
on:
  schedule:
    - cron: "17 * * * *"  # minute 17: GitHub delays or drops runs scheduled at the top of the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch state from the data branch
        run: |
          mkdir -p state
          if git fetch --depth 1 origin data 2>/dev/null; then
            git --work-tree=state checkout FETCH_HEAD -- . && git reset -q
          fi
          ls -la state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[llm]"
      - name: Run one cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: tradingfloor live --state-dir state --cache state/market.json.gz
      - name: Publish state
        run: |
          cd state
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "state as of $(date -u +%Y-%m-%dT%H:00Z)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
